gstreamer_decoder:
  ros__parameters:
    use_custom_stream_msg: false
    compressed_topic: /equirectangular/image/h264
    uncompressed_topic: /equirectangular/image/decoded
    pipeline: "appsrc name=source is-live=true format=time ! h264parse ! avdec_h264 ! videoconvert ! video/x-raw,format=BGR ! appsink name=sink sync=false"
