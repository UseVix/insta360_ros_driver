gstreamer_encoder:
  ros__parameters:
    input_topic: /equirectangular/image
    output_topic: /equirectangular/image/h264
    transport: ros
    pipeline: "appsrc ! videoconvert ! vaapih264enc ! rtph264pay pt=96 ! udpsink host=192.168.1.50 port=5000"
    ros_pipeline: "appsrc name=ros_source is-live=true ! videoconvert ! vaapih264enc keyframe-period=30 ! video/x-h264,stream-format=byte-stream ! h264parse config-interval=1 ! video/x-h264,stream-format=byte-stream ! appsink name=ros_sink sync=false"
    fps: 30.0
