gstreamer_encoder:
  ros__parameters:
    input_topic: /equirectangular/image
    output_topic: /equirectangular/image/h264
    transport: ros
    pipeline: "appsrc ! videoconvert ! x264enc tune=zerolatency bitrate=4000 ! rtph264pay pt=96 ! udpsink host=192.168.1.50 port=5000"
    ros_pipeline: "appsrc name=ros_source is-live=true ! videoconvert ! x264enc tune=zerolatency ! h264parse ! appsink name=ros_sink sync=false"
    fps: 30.0
